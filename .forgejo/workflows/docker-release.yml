name: Docker Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: node-bookworm
    container:
      image: node:bookworm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Docker
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name ci-builder --use
          docker buildx inspect --bootstrap

      - name: Log in to Container Registry
        run: |
          echo "$PACKAGE_TOKEN" | docker login forge.engelmann.me -u "$PACKAGE_USER" --password-stdin
        env:
          PACKAGE_USER: ${{ secrets.PACKAGE_USER }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="forge.engelmann.me/$GITHUB_REPOSITORY:${{ steps.tag.outputs.TAG }}"
          
          docker buildx build \
            --push \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --build-arg VERSION=${{ steps.tag.outputs.TAG }} \
            --file ./transports/Dockerfile \
            .
