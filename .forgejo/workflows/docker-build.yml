name: Docker Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  docker:
    runs-on: docker-full
    container:
      options: --privileged 
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Docker BuildX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends docker.io docker-compose
          # Manually install buildx plugin
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.2/docker-buildx-linux-amd64 -o /usr/local/lib/docker/cli-plugins/docker-buildx
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

      - name: Set up Docker Buildx
        run: |
          sudo docker buildx create --name ci-builder --use
          sudo docker buildx inspect --bootstrap

      - name: Log in to Container Registry
        run: |
          echo "$PACKAGE_TOKEN" | sudo docker login forge.engelmann.me -u "$PACKAGE_USER" --password-stdin
        env:
          PACKAGE_USER: ${{ secrets.PACKAGE_USER }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push Docker image
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          SHORT_SHA=${GITHUB_SHA:0:8}
          IMAGE_TAG="forge.engelmann.me/$GITHUB_REPOSITORY:${BRANCH_NAME}-${SHORT_SHA}"
          
          sudo docker buildx build \
            --push \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --build-arg VERSION=${GITHUB_SHA} \
            --file ./transports/Dockerfile \
            .
