name: Docker Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  docker:
    runs-on: docker-full
    container:
      image: node:bookworm
      options: --privileged 
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Docker
        run: |
          # Add Docker's official GPG key
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          
          # Add Docker repo
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          # Install Docker
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Set up Docker Buildx
        run: |
          sudo docker buildx create --name ci-builder --use
          sudo docker buildx inspect --bootstrap

      - name: Log in to Container Registry
        run: |
          echo "$PACKAGE_TOKEN" | sudo docker login forge.engelmann.me -u "$PACKAGE_USER" --password-stdin
        env:
          PACKAGE_USER: ${{ secrets.PACKAGE_USER }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push Docker image
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          SHORT_SHA=${GITHUB_SHA:0:8}
          IMAGE_TAG="forge.engelmann.me/$GITHUB_REPOSITORY:${BRANCH_NAME}-${SHORT_SHA}"
          
          sudo docker buildx build \
            --push \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --build-arg VERSION=${GITHUB_SHA} \
            --file ./transports/Dockerfile \
            .
